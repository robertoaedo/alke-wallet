<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Iniciar Sesión</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">Inicio de sesión</h2>
      
      <!-- Contenedor para Alertas de Bootstrap -->
      <div id="alert-container"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="admin@alkewallet.com" required>
        </div>
        
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script de Validación en jQuery -->
  <script>
    $(document).ready(function () {

      // Credenciales requeridas
      const usuarioValido = "admin@alkewallet.com";
      const claveValida = "123456";

      // Capturar evento submit del formulario
      $('#loginForm').submit(function (e) {
        e.preventDefault(); // Evita recargar la página

        // Obtener valores ingresados usando jQuery
        const email = $('#email').val().trim();
        const password = $('#password').val().trim();

        // Limpiar alertas anteriores
        $('#alert-container').empty();

        // Validar credenciales
        if (email === usuarioValido && password === claveValida) {
          // Guardar usuario en Local Storage
          localStorage.setItem('usuarioLogueado', email);

          // Mostrar mensaje de éxito
          $('#alert-container').html(`
            <div class="alert alert-success" role="alert">
              ¡Inicio de sesión exitoso! Redirigiendo al menú...
            </div>
          `);

          // Redirigir a menu.html tras 1.5 segundos
          setTimeout(function () {
            window.location.href = 'menu.html';
          }, 1500);

        } else {
          // Mostrar mensaje de error
          $('#alert-container').html(`
            <div class="alert alert-danger" role="alert">
              Correo o contraseña incorrectos. Intenta nuevamente.
            </div>
          `);
        }
      });

    });
  </script>
</body>
</html>
