<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Depositar Fondos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="menu.html">← Volver al Menú</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h3 class="text-primary fw-bold mb-3">Depositar Fondos</h3>
                    <p class="text-muted">Saldo actual: <strong id="balanceDisplay">$0.00</strong></p>
                    
                    <div id="depositAlert" class="alert d-none" role="alert"></div>

                    <form id="depositForm">
                        <div class="mb-3">
                            <label for="depositAmount" class="form-label">Monto a depositar ($)</label>
                            <input type="number" step="0.01" min="1" class="form-control form-control-lg" id="depositAmount" placeholder="0.00" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 btn-lg rounded-pill">Realizar Depósito</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/wallet.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
