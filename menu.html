<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Menú Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="menu.html">Alke Wallet</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="userDisplay">Hola, Usuario</span>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <!-- Balance Card -->
        <div class="card bg-gradient-primary text-white p-4 shadow border-0 rounded-4 mb-4">
            <h5 class="card-title text-uppercase opacity-75">Saldo Disponible</h5>
            <h1 class="display-3 fw-bold" id="balanceDisplay">$0.00</h1>
        </div>

        <!-- Acciones Rápidas -->
        <h4 class="mb-3 text-secondary">Acciones Rápidas</h4>
        <div class="row g-3">
            <div class="col-md-4">
                <a href="deposit.html" class="card action-card text-center p-4 shadow-sm border-0 text-decoration-none">
                    <i class="bi bi-wallet2 text-primary display-5 mb-2"></i>
                    <h5 class="text-dark m-0">Depositar Fondos</h5>
                </a>
            </div>
            <div class="col-md-4">
                <a href="sendmoney.html" class="card action-card text-center p-4 shadow-sm border-0 text-decoration-none">
                    <i class="bi bi-send-fill text-success display-5 mb-2"></i>
                    <h5 class="text-dark m-0">Enviar Dinero</h5>
                </a>
            </div>
            <div class="col-md-4">
                <a href="transactions.html" class="card action-card text-center p-4 shadow-sm border-0 text-decoration-none">
                    <i class="bi bi-clock-history text-warning display-5 mb-2"></i>
                    <h5 class="text-dark m-0">Últimos Movimientos</h5>
                </a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/wallet.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
