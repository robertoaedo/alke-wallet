<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Historial de Transacciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="menu.html">← Volver al Menú</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="text-primary fw-bold m-0">Últimos Movimientos</h3>
                <span class="badge bg-secondary p-2">Actualizado en tiempo real</span>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Tipo</th>
                            <th>Descripción / Detalle</th>
                            <th>Monto</th>
                            <th>Fecha y Hora</th>
                        </tr>
                    </thead>
                    <tbody id="transactionHistoryTable">
                        <!-- Movimientos insertados dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/wallet.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
